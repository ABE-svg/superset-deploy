# =========================================================================
# DOCKER COMPOSE FOR PRODUCTION - OPTIMISED
# =========================================================================
# Drops the components that are unnecessary in production (Node, Cypress).
# Uses the pre-built Superset image.


# PINNED version. Never use `latest`: on 2026-08-31 the Docker Hub `latest` tag
# moved from 6.0.0 to 6.1.0 without warning, and a casual `docker compose pull`
# would have carried out the upgrade (database migration included) without anyone
# asking for it. TAG and BROWSER_TAG move together — the browser image is built
# FROM apache/superset:${SUPERSET_VERSION}.
x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-6.1.0}
# The same image plus Playwright/Chromium, for the Alerts & Reports screenshots.
# Build: docker build --build-arg SUPERSET_VERSION=6.1.0 -t astecha/superset-browser:6.1.0 docker-browser/
# Only the worker needs the browser (see the Alerts and Reports documentation).
x-superset-browser-image: &superset-browser-image astecha/superset-browser:${BROWSER_TAG:-6.1.0}

services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/superset.conf:/etc/nginx/conf.d/superset.conf:ro
      - ./conf/certbot/conf:/etc/letsencrypt:ro
      - ./conf/certbot/www:/var/www/certbot:ro
      - ./logs:/var/log/nginx
    depends_on:
      - superset
    networks:
      - superset
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./conf/certbot/conf:/etc/letsencrypt
      - ./conf/certbot/www:/var/www/certbot
    networks:
      - superset

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - superset

  # NOTE: there is no `db` service. The metadata database is OVHcloud Managed
  # PostgreSQL, an external service reached over TLS. Connection details live in
  # docker/.env-local; the TLS-enforcing URI is built in
  # docker/pythonpath_dev/superset_config_docker.py.

  superset:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    # "app-gunicorn", NOT "app". The "app" branch of docker-bootstrap.sh runs
    #   flask run --reload --debugger --without-threads
    # which is the single-threaded development server with the Werkzeug debugger
    # enabled — unsuitable and unsafe for production. "app-gunicorn" runs the
    # image's /usr/bin/run-server.sh, i.e. real Gunicorn. Worker counts are tuned
    # via SERVER_WORKER_AMOUNT in docker/.env-local.
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    expose:
      - 8088
    depends_on:
      redis:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
      # Brand assets (logos) served under /static/assets/astecha/ — referenced by
      # the theme in docker/themes/*.json and by APP_ICON in superset_config_docker.py.
      - ./docker/assets:/app/superset/static/assets/astecha:ro
    networks:
      - superset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-init:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

  superset-worker:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-browser-image
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-worker-beat:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

  # Only for Global Async Queries (GAQ), which we do NOT use. Kept behind a profile
  # so that `compose up -d` does not start it: without GAQ, docker-bootstrap.sh
  # answers "Unknown Operation!!!" and the container enters a restart loop (observed
  # during the 6.1.0 upgrade).
  superset-websocket:
    profiles: ["gaq"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "websocket"]
    restart: unless-stopped
    ports:
      - "${WEBSOCKET_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

volumes:
  superset_home:
    driver: local
  redis:
    driver: local

networks:
  superset:
    driver: bridge
