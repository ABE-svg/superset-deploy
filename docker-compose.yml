# =========================================================================
# Apache Superset - production stack for Dokploy on an OVHcloud instance
# =========================================================================
#
#   Internet -> Traefik (Dokploy, TLS) -> superset:8088
#                                            |
#                                            +-- redis          (internal only)
#                                            +-- PostgreSQL     (OVHcloud managed, external)
#
# There is no PostgreSQL service here on purpose: the metadata database is
# OVHcloud Managed PostgreSQL, reached over the vRack private network.
# There is no nginx and no certbot either: Dokploy's Traefik terminates TLS and
# obtains the Let's Encrypt certificate. Adding a second reverse proxy behind
# the first would buy nothing and double the places a header can be lost.
#
# Values come from environment variables that Dokploy writes into a .env file
# next to this one. Dokploy does NOT inject its UI variables into containers by
# itself, which is why every service below declares `env_file: .env` explicitly.
# =========================================================================

x-superset-common: &superset-common
  # Every Superset service runs the same locally-built image. Compose builds it
  # once and reuses it for the other three.
  build:
    context: .
    args:
      SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
  image: superset-ovh:${SUPERSET_VERSION:-6.1.0}
  env_file: .env
  environment:
    # Timestamps are stored in UTC regardless; this affects log readability and
    # how the container renders local times.
    TZ: ${TZ:-Europe/Paris}
  restart: unless-stopped
  networks:
    - internal
  volumes:
    - superset_home:/app/superset_home

services:
  # -----------------------------------------------------------------------
  # Web application. The ONLY service Traefik can reach.
  # -----------------------------------------------------------------------
  superset:
    <<: *superset-common
    # "app-gunicorn", not "app". The "app" branch of the image's bootstrap
    # script starts Flask's development server with the auto-reloader and the
    # Werkzeug debugger - single-threaded, and an unacceptable production
    # exposure. This branch runs real Gunicorn via /usr/bin/run-server.sh.
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    depends_on:
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    # `expose`, never `ports`: reachable from Traefik over the Docker network,
    # never published on the host. Nothing but 80, 443 and the Dokploy panel
    # should be listening on a public interface.
    expose:
      - "8088"
    networks:
      - internal
      # Traefik lives on this external network. Without it, Dokploy can attach a
      # domain but requests will never reach the container.
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: the first boot loads the whole application before answering.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${SUPERSET_MEMORY_LIMIT:-3g}

  # -----------------------------------------------------------------------
  # One-shot initialisation: schema migration, roles, admin account.
  # Runs to completion on every deploy; everything else waits for it.
  # -----------------------------------------------------------------------
  superset-init:
    <<: *superset-common
    # Not a long-running service: restarting it on exit would loop forever.
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    # `create-admin` is intentionally tolerant. It exits non-zero when the user
    # already exists, which is the normal case on every redeploy after the
    # first; without `|| true` the whole stack would refuse to start.
    command:
      - /bin/bash
      - -c
      - |
        set -e
        echo "==> Applying database migrations"
        superset db upgrade
        echo "==> Creating admin user (ignored if it already exists)"
        superset fab create-admin \
          --username "${ADMIN_USERNAME:-admin}" \
          --firstname "${ADMIN_FIRSTNAME:-Admin}" \
          --lastname "${ADMIN_LASTNAME:-User}" \
          --email "${ADMIN_EMAIL:?ADMIN_EMAIL must be set}" \
          --password "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}" || true
        echo "==> Creating default roles and permissions"
        superset init
        echo "==> Initialisation complete"
    healthcheck:
      disable: true

  # -----------------------------------------------------------------------
  # Celery worker: async SQL Lab queries, dashboard thumbnails, cache warm-up.
  # -----------------------------------------------------------------------
  superset-worker:
    <<: *superset-common
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2g}

  # -----------------------------------------------------------------------
  # Celery beat: schedules the periodic tasks the worker executes.
  # Exactly one instance must run, or scheduled tasks fire more than once.
  # -----------------------------------------------------------------------
  superset-worker-beat:
    <<: *superset-common
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    depends_on:
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: ${BEAT_MEMORY_LIMIT:-512m}

  # -----------------------------------------------------------------------
  # Redis: cache and Celery broker. Internal network only, never published.
  # -----------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # No `ports`. Redis has no authentication configured here, which is safe
    # precisely because it is unreachable from outside the Docker network.
    # Publishing it, even on 127.0.0.1, would widen that surface for no gain.
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # Evict the least-recently-used cache entries instead of returning errors
      # when memory fills. Correct for a cache; it is why the Celery broker uses
      # a different logical database.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-768m}

volumes:
  # SQL Lab uploads and assets written at runtime. NOT a backup: the metadata
  # (dashboards, charts, users) lives in OVHcloud Managed PostgreSQL, and this
  # volume disappears with the instance.
  superset_home:
  # Redis persistence. Losing it costs a cold cache, nothing more.
  redis_data:

networks:
  # Reachable only between the containers below. Redis, the workers and the
  # init job are on this network alone and have no route to or from the internet.
  internal:
    driver: bridge
  # Created by Dokploy when it installs Traefik. `external: true` means compose
  # attaches to it rather than trying to create it.
  dokploy-network:
    external: true
