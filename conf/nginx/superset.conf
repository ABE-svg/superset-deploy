# Upstream for Superset
upstream superset_app {
    server superset:8088;
    keepalive 100;
}

# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name dashboard.astecha.com.br;

    # Allows Let's Encrypt to perform its validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name dashboard.astecha.com.br;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/dashboard.astecha.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.astecha.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block zgrab scans by User-Agent
    if ($http_user_agent ~* "zgrab") {
        return 403;
    }

    # Block dangerous HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$ ) {
        return 405;
    }

    # Limit the request body size (already set in nginx.conf, but this can override it)
    client_max_body_size 50M;

    # Hide the NGINX version
    server_tokens off;

    # Block access to hidden and sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Main Superset application
    location / {
        proxy_pass http://superset_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        port_in_redirect off;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
